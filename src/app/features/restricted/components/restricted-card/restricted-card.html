<div class="restricted-container">
  <div class="restricted-card">
    <div class="lock-icon">🔒</div>
    <p class="eyebrow">Exclusive Content for Enrolled Students & Instructors</p>
    <h1 class="restricted-title">Access Restricted</h1>
    <p class="restricted-message">{{ displayMessage() }}</p>

    <div class="card-actions">
      <a [routerLink]="dashboardLink()" class="btn-return">
        Return to Dashboard
      </a>
    </div>
  </div>
</div>
