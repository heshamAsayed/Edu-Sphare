<section class="grid"><article><h2>Timeline</h2><p>Add a school or platform event.</p><input type="date" [(ngModel)]="draft.date"><input placeholder="Event title" [(ngModel)]="draft.title"><textarea placeholder="Details" [(ngModel)]="draft.detail"></textarea><button (click)="add()">Add event</button><small>Saved locally until a Timeline API is available.</small></article><article><h2>Recent events</h2>@for(item of items();track item){<div class="event"><time>{{item.date}}</time><span><b>{{item.title}}</b><small>{{item.detail}}</small></span><button (click)="remove(item)">Remove</button></div>}@empty{<p>No events yet.</p>}</article></section>
