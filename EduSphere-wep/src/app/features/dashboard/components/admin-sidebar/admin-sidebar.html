<aside class="dash-sidebar">

  <div class="sidebar-brand">
    <span class="brand-icon">ES</span>
    <div>
      <p class="brand-name">EduSphare</p>
      <p class="brand-role">Admin Panel</p>
    </div>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.id) {
      <button
        type="button"
        class="nav-item"
        [class.active]="activeTab() === item.id"
        (click)="select(item.id)"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </button>
    }
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="nav-item footer-item" (click)="goHome()">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </button>
    <button type="button" class="nav-item footer-item logout" (click)="logout()">
      <span class="nav-icon">⎋</span>
      <span class="nav-label">Logout</span>
    </button>
  </div>

</aside>
