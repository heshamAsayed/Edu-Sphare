<!-- Right Section -->
<section class="form-section">

    <div class="register-container">

        <div class="heading">
            <h2>Create your account</h2>

            <p>
                Sign up to start your learning journey with EduSphere.
            </p>
        </div>


        <form  [formGroup]="registerForm" (ngSubmit)="OnSubmit()">

            <!-- Full Name -->
            <div class="form-group">

                <label for="name">
                    Full name
                </label>

                <input type="text" id="name" placeholder="Enter your full name" formControlName="Name" required>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input type="email" id="email" placeholder="you@example.com" formControlName="email" required>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password" id="password" placeholder="Create a password" formControlName="password" required>

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirm-password">
                    Confirm password
                </label>

                <input type="password" id="confirm-password" placeholder="Confirm your password" formControlName="confirmPassword" required>

            </div>


            <!-- Terms -->
            <label class="terms">

                <input type="checkbox" required (change)="IAgree()">

                <span>
                    I agree to the
                    <a href="#">Terms of Service</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </span>

            </label>

            <!-- Submit -->
            <!-- @if (Agreement){
            <button type="submit">
                Create account
            </button>

            }@else{
            <button disabled="true" type="submit">
                Create account
            </button>
            } -->


              <button type="submit" [disabled]="!Agreement">
                Create account
            </button>

        </form>


        <!-- Login -->
        <div class="login-link">

            <span>
                Already have an account?
            </span>

            <a routerLink="/login">
                Sign in
            </a>

        </div>

    </div>

</section>
