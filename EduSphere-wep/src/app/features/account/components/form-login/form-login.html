<!-- Right Section -->
<section class="form-section">

    <div class="login-container">

        <div class="heading">
            <h2>Welcome back</h2>
            <p>Sign in to continue to your EduSphere account.</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" formControlName="email" required
                       [attr.aria-invalid]="!!modelError()">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" formControlName="password" required
                       [attr.aria-invalid]="!!modelError()">
            </div>

            <!-- Remember + Forgot -->
            <div class="form-options">
                <label class="remember">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <!-- Error Message — shown immediately above submit -->
            @if (modelError(); as err) {
              <div class="error-message" role="alert" aria-live="assertive">
                {{ err }}
              </div>
            }

            <!-- Submit -->
            <button type="submit" [disabled]="isLoading()">
                @if (isLoading()) {
                  <span class="button-spinner" aria-hidden="true"></span>
                  Signing in...
                } @else {
                  Sign in
                }
            </button>

        </form>

        <!-- Register -->
        <div class="register">
            <span>New to EduSphere?</span>
            <a routerLink="/registeration">Create an account</a>
        </div>

    </div>

</section>
