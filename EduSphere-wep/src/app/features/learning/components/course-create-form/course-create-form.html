<div class="course-form-card">
  <div class="card-header">
    <h2 class="card-title">Course Information</h2>
    @if (teacherSchoolName()) {
      <span class="school-badge">🏫 School: {{ teacherSchoolName() }}</span>
    }
  </div>

  <form (ngSubmit)="onSubmit()" class="form-body">
    <div class="form-grid">
      <div class="form-group">
        <label>Course Name *</label>
        <input
          type="text"
          [ngModel]="name()"
          (ngModelChange)="onNameChange($event)"
          name="name"
          placeholder="e.g. Physics - Chapter 1"
          required />
      </div>

      <div class="form-group">
        <label>Course Price ($)</label>
        <input
          type="number"
          min="0"
          [ngModel]="price()"
          (ngModelChange)="onPriceChange($event)"
          name="price"
          placeholder="0.00" />
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Educational Stage *</label>
        <select
          [ngModel]="selectedStageId()"
          (ngModelChange)="onStageChange($event)"
          name="stageId"
          required>
          <option value="">Select Educational Stage</option>
          @for (stg of stages(); track stg.id) {
            <option [value]="stg.id">{{ stg.name }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label>Academic Year *</label>
        <select
          [ngModel]="selectedYearId()"
          (ngModelChange)="onYearChange($event)"
          name="yearId"
          [disabled]="!selectedStageId()"
          required>
          <option value="">Select Academic Year</option>
          @for (yr of availableYears(); track yr.id) {
            <option [value]="yr.id">{{ yr.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-group image-upload-group">
      <label>Course Cover Image (optional)</label>
      <input
        type="file"
        accept="image/jpeg,image/png,image/webp"
        (change)="onImagePick($event)"
        [disabled]="isCreating()" />
      <p class="field-hint">JPG, PNG, or WebP — max 2 MB. This image appears on the course card.</p>
      @if (imageError()) {
        <p class="field-error">{{ imageError() }}</p>
      }
      @if (imagePreviewUrl()) {
        <div class="image-preview-wrap">
          <img [src]="imagePreviewUrl()" alt="Course cover preview" class="image-preview" />
          <button type="button" class="btn-clear-image" (click)="clearImage()" [disabled]="isCreating()">
            Remove
          </button>
        </div>
      }
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit-course" [disabled]="isCreating()">
        @if (isCreating()) {
          <span>⏳ Creating Course...</span>
        } @else {
          <span>🚀 Create Course & Continue to Upload Lessons</span>
        }
      </button>
    </div>
  </form>
</div>
