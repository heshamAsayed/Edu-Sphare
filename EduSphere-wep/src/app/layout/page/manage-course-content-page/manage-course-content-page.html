<app-navbar></app-navbar>

<div class="content-manage-root">
  <div class="page-container">
    @if (isLoading()) {
      <div class="loading-wrapper">
        <app-loading-spinner [isLoading]="true" size="large" loadingText="Loading course content..."></app-loading-spinner>
      </div>
    } @else {
      <app-course-content-header
        [course]="course()"
        [videosCount]="videos().length">
      </app-course-content-header>

      <app-video-upload-form
        [courseId]="courseId()"
        [defaultOrder]="videos().length"
        [isUploading]="isUploading()"
        [uploadProgress]="uploadProgress()"
        [progressBytes]="progressBytes()"
        [currentUploadInfo]="currentUploadInfo()"
        [uploadStatusMessage]="uploadStatusMessage()"
        (uploadBatchSubmit)="onUploadBatchSubmit($event)">
      </app-video-upload-form>

      <app-video-reorder-list
        [videos]="videos()"
        [transcriptionStatuses]="transcriptionStatuses()"
        (saveOrder)="onSaveOrder($event)">
      </app-video-reorder-list>
    }
  </div>
</div>

<app-footer></app-footer>
