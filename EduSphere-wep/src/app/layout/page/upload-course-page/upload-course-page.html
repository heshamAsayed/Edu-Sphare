<app-navbar></app-navbar>

<div class="upload-course-root">
  <div class="page-container">
    <div class="page-header-card">
      <div>
        <h1 class="page-title">Create New Course</h1>
        <p class="page-subtitle">Fill in the course details below. Once created, you will be redirected to upload and manage lessons.</p>
      </div>
    </div>

    @if (isLoadingStages()) {
      <div class="loading-wrapper">
        <app-loading-spinner [isLoading]="true" size="large" loadingText="Loading stages and academic years..."></app-loading-spinner>
      </div>
    } @else {
      <app-course-create-form
        [stages]="stages()"
        [teacherSchoolName]="teacherSchoolName()"
        [isCreating]="isCreating()"
        (formSubmit)="onFormSubmit($event)">
      </app-course-create-form>
    }
  </div>
</div>

<app-footer></app-footer>
