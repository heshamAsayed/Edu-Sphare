
<!DOCTYPE html>

<html lang="en" dir="ltr">
<!--begin::Head-->

<head>
    <base href="">
    <meta charset="utf-8" />
    <title>Fawaterak - Iframe Integrations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"     content="احصل على حساب التاجر في دقائق ، وقم بإنشاء متجرك وفواتيرك ، و استقبل فلوسك من خلال الماستر كارت او الفيزابامان. الآن مع فواتيرك ، امنح لعملائك القدرة على الدفع اونلاين والحصول علي خدماتك او منتجاتك بسهولة، انشئ لهم فاتورة الكترونية وارسلها عن طريق البريد الإلكتروني أو الرسائل القصيرة"
    >
</head>


<body>
<button id="payButton">ادفع الآن</button>
<div id="status"></div>

<script>
async function payNow() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'جاري تجهيز عملية الدفع...';

  // بيانات ثابتة (Fixed Data) - عدّلها حسب احتياجك
  const fixedOrderData = {
    orderId: 1001,
    amountEgp: 250,
    firstName: "Ahmed",
    lastName: "Ali",
    email: "ahmed@example.com",
    phoneNumber: "+201234567890"
  };

  try {
    // بننده على الباك إند بتاعنا (.NET) مش على Paymob مباشرة
    const response = await fetch('https://yourapi.com/api/payment/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(fixedOrderData)
    });

    if (!response.ok) {
      throw new Error('فشل إنشاء عملية الدفع');
    }

    const data = await response.json();

    // نخزن orderId مؤقتًا عشان نستخدمه بعد الرجوع
    sessionStorage.setItem('pendingOrderId', fixedOrderData.orderId);

    // نحوّل العميل لصفحة Paymob
    window.location.href = data.unifiedCheckoutUrl;

  } catch (error) {
    statusEl.textContent = 'حصل خطأ: ' + error.message;
  }
}

document.getElementById('payButton').addEventListener('click', payNow);
</script>
</body>
<!--end::Body-->
</html>
